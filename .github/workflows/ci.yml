name: CRM CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API dependencies
        run: pip install -e ".[dev]"
      - name: Run API tests
        run: pytest -q

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aastha_ci
          POSTGRES_USER: aastha
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aastha -d aastha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://aastha:ci-only-password@localhost:5432/aastha_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API dependencies
        run: pip install -e ".[dev]"
      - name: Migrate blank PostgreSQL database
        run: alembic upgrade head
      - name: Verify migration head and table count
        run: >-
          python -c "import os;
          from sqlalchemy import create_engine, text;
          engine=create_engine(os.environ['DATABASE_URL']);
          connection=engine.connect();
          version=connection.execute(text('SELECT version_num FROM alembic_version')).scalar_one();
          tables=connection.execute(text(\"SELECT count(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema')\")).scalar_one();
          connection.close();
          assert version == '0012_clinical_team', version;
          assert tables >= 63, tables"

      - name: Test reception staff lifecycle on PostgreSQL
        env:
          STAFF_TEST_DATABASE_URL: postgresql+psycopg://aastha:ci-only-password@localhost:5432/aastha_ci
        run: pytest -q tests/test_staff_access.py tests/test_lead_register.py tests/test_appointments.py tests/test_patient_registration.py tests/test_visit_management.py tests/test_consultation_workflow.py
      - name: Verify additive Doctor migration on populated clinic data
        run: |
          alembic downgrade 0010_consultation_payments
          python ../../tools/verify_doctor_upgrade.py snapshot
          alembic upgrade head
          python ../../tools/verify_doctor_upgrade.py verify
      - name: Test Doctor workflow and concurrent saves on PostgreSQL
        env:
          STAFF_TEST_DATABASE_URL: postgresql+psycopg://aastha:ci-only-password@localhost:5432/aastha_ci
        run: pytest -q tests/test_doctor_consultations.py
      - name: Verify Clinical Team upgrade preserves populated clinic records
        run: |
          alembic downgrade 0011_doctor_consultation
          python ../../tools/verify_clinical_team_upgrade.py snapshot
          alembic upgrade head
          python ../../tools/verify_clinical_team_upgrade.py verify
      - name: Test clinical accounts, preparation and concurrent handover
        env:
          STAFF_TEST_DATABASE_URL: postgresql+psycopg://aastha:ci-only-password@localhost:5432/aastha_ci
        run: pytest -q tests/test_clinical_team.py
      - name: Verify logical backup and restore of the test database
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U aastha -d aastha_ci -Fc > /tmp/staff-ci.dump
          docker exec ${{ job.services.postgres.id }} createdb -U aastha aastha_restore
          docker exec -i ${{ job.services.postgres.id }} pg_restore --exit-on-error -U aastha -d aastha_restore < /tmp/staff-ci.dump
          python - <<'PYTEST'
          import os
          from sqlalchemy import create_engine, text
          source = create_engine(os.environ['DATABASE_URL'])
          restored = create_engine(os.environ['DATABASE_URL'].rsplit('/', 1)[0] + '/aastha_restore')
          with source.connect() as a, restored.connect() as b:
              for table in ('core.users', 'core.user_roles', 'audit.audit_events', 'crm.leads', 'crm.lead_contacts', 'crm.lead_interactions', 'crm.lead_status_history', 'crm.lead_dnc_history', 'scheduling.appointments', 'scheduling.doctor_schedules', 'scheduling.schedule_exceptions', 'patient.patients', 'patient.patient_contacts', 'patient.patient_addresses', 'crm.lead_patient_links', 'core.number_series', 'clinical.visits', 'clinical.visit_complaints', 'clinical.consultation_notes', 'clinical.consultation_note_revisions', 'clinical.assistant_preparations', 'clinical.assistant_preparation_revisions', 'consultation_finance.consultation_bills', 'consultation_finance.payments', 'consultation_finance.entitlements', 'consultation_finance.entitlement_usages', 'consultation_finance.consultation_clearances', 'consultation_finance.complimentary_authorizations', 'consultation_finance.fee_versions', 'consultation_finance.policy_versions'):
                  sql = text('SELECT count(*) FROM ' + table)
                  assert a.execute(sql).scalar_one() == b.execute(sql).scalar_one(), table
                  rows = text('SELECT to_jsonb(t) FROM ' + table + ' AS t ORDER BY to_jsonb(t)::text')
                  assert a.execute(rows).all() == b.execute(rows).all(), table + ' restored content'
              assert b.execute(text('SELECT version_num FROM alembic_version')).scalar_one() == '0012_clinical_team'
          print('Logical backup restored; staff, Lead records, histories, audit and migration version match')
          PYTEST

      - name: Verify populated financial migration preserves historical money
        run: |
          python ../../tools/verify_finance_upgrade.py snapshot
          alembic downgrade 0009_visit_management
          alembic upgrade head
          python ../../tools/verify_finance_upgrade.py verify
      - name: Verify populated Visit migration preserves existing encounters
        run: |
          python ../../tools/verify_visit_upgrade.py snapshot
          alembic downgrade 0008_patient_registration
          alembic upgrade head
          python ../../tools/verify_visit_upgrade.py verify
      - name: Verify upgrade of a populated pre-staff database
        run: |
          python -c "import os; from sqlalchemy import create_engine,text; c=create_engine(os.environ['DATABASE_URL']).connect(); assert c.execute(text('SELECT count(*) FROM core.users')).scalar_one() > 0"
          alembic downgrade 0005_integration_clients
          python ../../tools/verify_patient_upgrade.py prepare
          alembic upgrade head
          python ../../tools/verify_patient_upgrade.py verify
          STAFF_TEST_DATABASE_URL="$DATABASE_URL" pytest -q tests/test_staff_access.py

  staff-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aastha_staff_browser
          POSTGRES_USER: aastha
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aastha -d aastha_staff_browser"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://aastha:ci-only-password@localhost:5432/aastha_staff_browser
      JWT_SECRET: isolated-browser-test-signing-key-not-production
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      API_CORS_ORIGINS: http://127.0.0.1:3000
      STAFF_ADMIN_USERNAME: admin
      STAFF_ADMIN_PASSWORD: Browser!Admin2026
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: Browser!Admin2026
      BOOTSTRAP_DOCTOR_PASSWORD: Browser!Doctor2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start isolated API with PostgreSQL
        working-directory: apps/api
        run: |
          pip install -e .
          alembic upgrade head
          python -m app.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/staff-api.log 2>&1 &
      - name: Build and start web app
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm start -- -p 3000 > /tmp/staff-web.log 2>&1 &
      - name: Exercise reception staff lifecycle in Chromium
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/login > /dev/null && break || sleep 2; done
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: cat /tmp/staff-api.log /tmp/staff-web.log

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: https://aastha-phase1-api-staging.onrender.com/api/v1
        run: npm run build

  production-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API production image
        run: docker build -f apps/api/Dockerfile.prod -t aastha-crm-api:ci apps/api
      - name: Build web production image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=https://aastha-phase1-api-staging.onrender.com/api/v1
          -f apps/web/Dockerfile.prod
          -t aastha-crm-web:ci
          apps/web
